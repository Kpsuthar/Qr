<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #007BFF;
            --secondary: #FF6F00;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: white;
        }

        /* Background Blobs */
        .blob-1, .blob-2 {
            position: fixed; width: 350px; height: 350px;
            filter: blur(90px); z-index: -1; border-radius: 50%; opacity: 0.25;
        }
        .blob-1 { top: -50px; left: -50px; background: var(--primary); }
        .blob-2 { bottom: -50px; right: -50px; background: var(--secondary); }

        /* Navigation */
        .glass-nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            padding: 20px 40px; text-align: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
        }
        .p-blue { color: var(--primary); font-weight: 800; font-size: 1.4rem; }
        .d-orange { color: var(--secondary); font-weight: 800; font-size: 1.4rem; }

        /* Content Wrapper */
        .content-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 20px 60px; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 30px;
            width: 100%; max-width: 450px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .header-icon { font-size: 2.2rem; color: var(--primary); margin-bottom: 15px; }
        h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; }
        p.desc { color: #6668a8; font-size: 0.9rem; margin-bottom: 30px; }

        /* Input Group */
        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { 
            display: block; font-size: 0.7rem; text-transform: uppercase; 
            letter-spacing: 1.5px; color: #64748b; margin-bottom: 10px; 
        }
        .input-group input {
            width: 100%; background: rgba(255,255,255,0.07);
            border: 1px solid var(--glass-border); padding: 15px;
            border-radius: 12px; color: #007BFF; outline: none; transition: 0.3s;
            font-weight: 600;
        }
        .input-group input::placeholder { color: #0065f1; opacity: 0.6; }
        .input-group input:focus { border-color: var(--primary); background: rgba(255,255,255,0.12); }

        /* Button */
        .main-btn {
            width: 100%; padding: 16px; border-radius: 15px;
            border: none; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            gap: 12px; transition: 0.4s;
        }
        .main-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 123, 255, 0.4); }

        /* QR Display Area */
        .result-display {
            margin-top: 35px; min-height: 200px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); padding: 25px; border-radius: 20px;
            border: 1px solid var(--glass-border);
            transition: 0.5s; opacity: 0; transform: scale(0.9);
        }
        .result-display.active { opacity: 1; transform: scale(1); }

        #qrImage {
            max-width: 160px; border-radius: 12px;
            padding: 10px; background: white;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.2);
        }

        .qr-label { margin-top: 15px; font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        footer { padding: 40px; text-align: center; color: #64748b; font-size: 0.85rem; }
        .footer-brand { color: #fbbf24; font-weight: 700; }
    </style>
</head>
<body>

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <nav class="glass-nav">
        <div class="nav-brand"><span class="p-blue">SK</span><span class="d-orange"></span></div>
    </nav>

    <div class="content-wrapper">
        <div class="glass-card">
            <div class="header-icon"><i class="fas fa-qrcode"></i></div>
            <h1>QR Generator</h1>
            <p class="desc">Instant high-fidelity data encoding.</p>

            <div class="input-group">
                <label>Target URL or Text</label>
                <input type="text" id="qrInput" placeholder="Enter link here...">
            </div>

            <button class="main-btn" onclick="generateQR()">
                Generate QR <i class="fas fa-sync-alt"></i>
            </button>

            <div class="result-display" id="resultBox">
                <img src="" id="qrImage" alt="QR Code">
                <p class="qr-label">Ready to scan</p>
            </div>
        </div>
    </div>

    <footer>
        Designed by <span class="footer-brand">Kiran Suthar</span> &copy; 2026
    </footer>

    <script>
        function generateQR() {
            const input = document.getElementById("qrInput");
            const image = document.getElementById("qrImage");
            const box = document.getElementById("resultBox");

            if (input.value.trim() !== "") {
                const api = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(input.value)}`;
                image.src = api;
                
                // Show with animation
                box.classList.add("active");
                
                // Change button icon temporarily for feedback
                const btn = document.querySelector('.main-btn');
                const originalIcon = btn.innerHTML;
                btn.innerHTML = 'Encoding... <i class="fas fa-circle-notch fa-spin"></i>';
                
                image.onload = () => {
                    btn.innerHTML = 'Generated! <i class="fas fa-check"></i>';
                    setTimeout(() => btn.innerHTML = originalIcon, 2000);
                };
            } else {
                input.style.borderColor = "var(--secondary)";
                setTimeout(() => input.style.borderColor = "var(--glass-border)", 1000);
            }
        }
    </script>
</body>
</html>
